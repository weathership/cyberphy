# OTEL Navigator Deployment for air-gap RKE2 environment
# Visualization dashboard for OTEL traces using HoloViews + Datashader + Dask
#
# Uses the pre-baked cybersec-dask image with:
# - All Python dependencies pre-installed
# - OTEL Navigator application at /app/otel-navigator.py
# - NavigatorEngine + PTY proxy packages (M2)
# - ghostty-web WASM terminal for air-gap terminal
# - Numba JIT cache pre-compiled
#
# Startup time: ~10-15 seconds (no pip install required)
#
# Zarf template variables:
#   ###ZARF_VAR_S3_ENDPOINT### - S3-compatible endpoint
#   ###ZARF_VAR_S3_ACCESS_KEY### - S3 access key
#   ###ZARF_VAR_S3_SECRET_KEY### - S3 secret key
---
apiVersion: v1
kind: Namespace
metadata:
  name: panel-viz
  labels:
    app.kubernetes.io/managed-by: zarf
    app.kubernetes.io/part-of: cybersec
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-navigator-config
  namespace: panel-viz
  labels:
    app: otel-navigator
    app.kubernetes.io/managed-by: zarf
data:
  # S3 bucket containing OTEL data — provided at deploy time (ZARF_VAR_S3_BUCKET),
  # never hardcoded; in air-gap the operator supplies it via --set S3_BUCKET=...
  S3_BUCKET: "###ZARF_VAR_S3_BUCKET###"
  # Fallback base only. The app discovers the active dataset from
  # <bucket>/_active_dataset.json — the dataset name (e.g. otel-1t) is NOT baked in here.
  OTEL_DATA_PATH: "s3://###ZARF_VAR_S3_BUCKET###/"
  # AWS region for S3 access
  AWS_REGION: "###ZARF_VAR_S3_REGION###"
  # Data-View: sliding window over minute= partitions (6 files/min → ~90 in 15m)
  VPC_FLOW_PREFIX: "vpc-flow"
  DATA_VIEW_WINDOW_MIN: "15"
  DATA_VIEW_DISCOVERY_S: "2"
  DATA_VIEW_MAX_FILES: "102"
  # Optional AI agent (ACP). OFF by default; set AGENT_BACKEND=acp + a model
  # endpoint to enable. Read by the engine (cybersec.engine.agent.config).
  AGENT_BACKEND: "###ZARF_VAR_AGENT_BACKEND###"
  AGENT_ACP_COMMAND: "###ZARF_VAR_AGENT_ACP_COMMAND###"
  AGENT_MODEL_BASE_URL: "###ZARF_VAR_AGENT_MODEL_BASE_URL###"
  AGENT_MODEL: "###ZARF_VAR_AGENT_MODEL###"
---
apiVersion: v1
kind: Secret
metadata:
  name: otel-navigator-credentials
  namespace: panel-viz
  labels:
    app: otel-navigator
    app.kubernetes.io/managed-by: zarf
type: Opaque
stringData:
  # S3 / RustFS credentials - populated by Zarf variables
  # Local lab: admin/admin against RustFS; AWS air-gap: operator-supplied keys.
  AWS_ACCESS_KEY_ID: "###ZARF_VAR_S3_ACCESS_KEY###"
  AWS_SECRET_ACCESS_KEY: "###ZARF_VAR_S3_SECRET_KEY###"
  # AWS STS session token (for IAM role / temporary credentials)
  AWS_SESSION_TOKEN: "###ZARF_VAR_S3_SESSION_TOKEN###"
  # Optional: S3 endpoint for local RustFS (leave empty for AWS S3)
  S3_ENDPOINT: "###ZARF_VAR_S3_ENDPOINT###"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-navigator
  namespace: panel-viz
  labels:
    app: otel-navigator
    app.kubernetes.io/name: otel-navigator
    app.kubernetes.io/component: visualization
    app.kubernetes.io/managed-by: zarf
    app.kubernetes.io/part-of: cybersec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-navigator
  template:
    metadata:
      labels:
        app: otel-navigator
        app.kubernetes.io/name: otel-navigator
    spec:
      # Prefer scheduling near Dask workers for data locality
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    dask.org/component: worker
                topologyKey: kubernetes.io/hostname
      containers:
        - name: otel-navigator
          # Image will be rewritten by Zarf to use internal registry
          image: localhost:5555/cybersec-dask:2025.2.0-74bc219d3a
          imagePullPolicy: IfNotPresent
          # Serve OTEL Navigator with ghostty-web WASM assets for terminal
          command:
            - panel
            - serve
            - /app/otel-navigator.py
            - /app/data-view.py
            - --port=5006
            - --address=0.0.0.0
            - --allow-websocket-origin=*
            - --static-dirs
            - ghostty=/app/static/ghostty
          ports:
            - containerPort: 5006
              name: http
              protocol: TCP
          env:
            # Dask scheduler address (deployed in same cluster)
            - name: DASK_SCHEDULER
              value: "tcp://cybersec-dask-scheduler.dask.svc.cluster.local:8786"
            # Air-gap: Bokeh JS from the Panel/Bokeh server in this pod — never
            # cdn.bokeh.org. Jupyter uses "inline"; panel serve uses "server".
            - name: BOKEH_RESOURCES
              value: "server"
            # PTY proxy WS URL for the embedded terminal (and the `switch` REPL
            # command). Empty = browser auto-detect: :5006 pages target ws://host:8765,
            # anything else falls back to same-origin /ws — which the bundled ingress
            # now routes to the pty-proxy. For NodePort/tunnel access where neither
            # holds, set at deploy time: --set-variables PTY_PROXY_WS=ws://<node>:30765
            - name: PTY_PROXY_WS
              value: "###ZARF_VAR_PTY_PROXY_WS###"
          envFrom:
            - configMapRef:
                name: otel-navigator-config
            - secretRef:
                name: otel-navigator-credentials
          resources:
            requests:
              cpu: 500m
              memory: 4Gi
            limits:
              cpu: 2
              memory: 8Gi
          # TCP probe: Panel app loads data from S3 on HTTP requests, which
          # blocks in air-gap environments. Use TCP to verify Bokeh server is up.
          readinessProbe:
            tcpSocket:
              port: 5006
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 5006
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
        # PTY proxy sidecar: bridges terminal WebSocket to gRPC engine
        - name: pty-proxy
          image: localhost:5555/cybersec-dask:2025.2.0-74bc219d3a
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - cybersec.pty_proxy.server
            - --ws-port=8765
            - --engine-host=navigator-engine.panel-viz.svc.cluster.local
            - --engine-port=50051
          ports:
            - containerPort: 8765
              name: ws
              protocol: TCP
          env:
            - name: PYTHONPATH
              value: /app
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8765
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: otel-navigator
  namespace: panel-viz
  labels:
    app: otel-navigator
    app.kubernetes.io/name: otel-navigator
    app.kubernetes.io/managed-by: zarf
spec:
  type: NodePort
  selector:
    app: otel-navigator
  ports:
    - name: http
      port: 5006
      targetPort: 5006
      nodePort: 30506
    - name: ws
      port: 8765
      targetPort: 8765
      nodePort: 30765
