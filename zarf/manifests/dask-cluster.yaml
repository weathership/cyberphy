# DaskCluster for Cyberphy air-gap deployment
# Uses the custom cybersec-dask image with pre-baked Python dependencies
#
# Zarf template variables:
#   ###ZARF_VAR_DASK_WORKER_REPLICAS### - Number of worker pods (scale for multi-core / 2 TiB)
#   ###ZARF_VAR_DASK_WORKER_NTHREADS### - Threads per worker (match CPU limit)
#   ###ZARF_VAR_DASK_WORKER_MEMORY###   - Per-worker memory limit (also --memory-limit)
#   ###ZARF_VAR_DASK_WORKER_CPU###      - Per-worker CPU limit (should be >= nthreads)
#   ###ZARF_VAR_DASK_SPILL_DIR###       - Host path for worker spill-to-disk
#   ###ZARF_REGISTRY###                 - Zarf-injected registry URL (for image rewriting)
#
# Multi-core sizing (single fat node or multi-node air-gap):
#   lab  ~10 GiB HDF5 :  4–8 workers × 2–4 threads
#   2 TiB air-gap     : 16–32 workers (or node_count × 2–4), spill on fast disk/NFS
# Prefer patching DaskCluster.spec.worker.replicas (operator source of truth)
# over scaling the Deployment directly.
---
apiVersion: kubernetes.dask.org/v1
kind: DaskCluster
metadata:
  name: cybersec-dask
  namespace: dask
  labels:
    app.kubernetes.io/name: cybersec-dask
    app.kubernetes.io/component: cluster
    app.kubernetes.io/managed-by: zarf
    app.kubernetes.io/part-of: cybersec
spec:
  scheduler:
    service:
      type: NodePort
      selector:
        dask.org/cluster-name: cybersec-dask
        dask.org/component: scheduler
      ports:
        - name: tcp-comm
          port: 8786
          targetPort: tcp-comm
          nodePort: 30086
        - name: tcp-dashboard
          port: 8787
          targetPort: tcp-dashboard
          nodePort: 30087
    spec:
      restartPolicy: Always
      containers:
        - name: scheduler
          # Image will be rewritten by Zarf to use internal registry
          # Notebook image includes h5py/holoviews (HDF5 Dask tasks). Zarf rewrites tag.
          image: localhost:5555/cybersec-dask:2025.2.0-74bc219d3a
          imagePullPolicy: IfNotPresent
          args:
            - dask-scheduler
          ports:
            - containerPort: 8786
              name: tcp-comm
            - containerPort: 8787
              name: tcp-dashboard
          # S3 credentials are templated from the Zarf S3_* variables and
          # default to EMPTY. Empty AWS_ACCESS_KEY_ID/SECRET means boto3/s3fs
          # fall through to the default credential chain — on AWS that is the
          # EC2 instance role via IMDS (no static keys; nothing expires; STS
          # temp keys baked at deploy-time used to expire in ~1h, see
          # docs/scratch/2026-05-28/). In a TRUE AIR-GAP deploy against a local
          # S3-compatible gateway there is NO IMDS, so you MUST pass the gateway
          # creds at deploy time:
          #   --set S3_ENDPOINT=<url> --set S3_ACCESS_KEY=<k> --set S3_SECRET_KEY=<s>
          # Injected into BOTH scheduler and worker pods because dask-cluster is
          # a RAW-MANIFEST component (zarf.yaml) — no Helm chart renders these.
          env:
            - name: PYTHONPATH
              value: "/app"
            - name: S3_ENDPOINT
              value: "###ZARF_VAR_S3_ENDPOINT###"
            - name: AWS_REGION
              value: "###ZARF_VAR_S3_REGION###"
            - name: AWS_ACCESS_KEY_ID
              value: "###ZARF_VAR_S3_ACCESS_KEY###"
            - name: AWS_SECRET_ACCESS_KEY
              value: "###ZARF_VAR_S3_SECRET_KEY###"
            - name: AWS_SESSION_TOKEN
              value: "###ZARF_VAR_S3_SESSION_TOKEN###"
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: tcp-dashboard
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: tcp-dashboard
            initialDelaySeconds: 15
            periodSeconds: 30
  worker:
    replicas: ###ZARF_VAR_DASK_WORKER_REPLICAS###
    spec:
      restartPolicy: Always
      containers:
        - name: worker
          # Same notebook image as Jupyter — workers must import h5py for HDF5 tasks
          image: localhost:5555/cybersec-dask:2025.2.0-74bc219d3a
          imagePullPolicy: IfNotPresent
          args:
            - dask-worker
            - --nthreads
            - "###ZARF_VAR_DASK_WORKER_NTHREADS###"
            - --memory-limit
            - "###ZARF_VAR_DASK_WORKER_MEMORY###"
            - --local-directory
            - /dask-spill
          # See scheduler comment above — S3 creds are templated from the Zarf
          # S3_* variables (empty default => AWS IMDS fallback; set them for a
          # non-AWS / air-gap S3 gateway). Injected here too because the Dask
          # WORKERS perform the actual parquet/HDF5 read for the data path.
          env:
            - name: DASK_DASHBOARD_ADDRESS
              value: ":8787"
            - name: PYTHONPATH
              value: "/app"
            - name: S3_ENDPOINT
              value: "###ZARF_VAR_S3_ENDPOINT###"
            - name: AWS_REGION
              value: "###ZARF_VAR_S3_REGION###"
            - name: AWS_ACCESS_KEY_ID
              value: "###ZARF_VAR_S3_ACCESS_KEY###"
            - name: AWS_SECRET_ACCESS_KEY
              value: "###ZARF_VAR_S3_SECRET_KEY###"
            - name: AWS_SESSION_TOKEN
              value: "###ZARF_VAR_S3_SESSION_TOKEN###"
          volumeMounts:
            - name: dask-spill
              mountPath: /dask-spill
          resources:
            requests:
              # Request less than limit so several workers pack onto one fat node
              cpu: "500m"
              memory: 2Gi
            limits:
              # CPU limit must be >= nthreads or the worker is artificially serial
              cpu: "###ZARF_VAR_DASK_WORKER_CPU###"
              memory: "###ZARF_VAR_DASK_WORKER_MEMORY###"
      volumes:
        - name: dask-spill
          hostPath:
            path: "###ZARF_VAR_DASK_SPILL_DIR###"
            type: DirectoryOrCreate
