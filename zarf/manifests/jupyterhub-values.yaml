# Helm values for JupyterHub deployment in air-gap environment
# https://z2jh.jupyter.org/en/stable/
#
# Key features:
# - Uses custom cybersec-dask image with pre-installed dependencies
# - Configures Dask Gateway integration
# - Sets up persistent storage for user notebooks
# - Mounts sample notebooks via ConfigMap
#
# Zarf template variables:
#   ###ZARF_VAR_S3_ENDPOINT### - S3-compatible endpoint
#   ###ZARF_VAR_S3_ACCESS_KEY### - S3 access key
#   ###ZARF_VAR_S3_SECRET_KEY### - S3 secret key
#   ###ZARF_VAR_INGRESS_DOMAIN### - Base domain for ingress

# Hub configuration
hub:
  # Note: Image will be rewritten by Zarf
  image:
    name: quay.io/jupyterhub/k8s-hub
    tag: "4.0.0"
    # Air-gap: never attempt an upstream pull — image is in the internal registry
    pullPolicy: IfNotPresent
  # Hub database — in-memory SQLite, no PVC required.
  # The default (sqlite-pvc) creates a 1Gi PVC with the cluster's default
  # StorageClass. On air-gapped RKE2 without a running local-path-provisioner,
  # that PVC stays Pending forever and blocks the hub from starting.
  # With sqlite-memory, hub state (sessions, tokens) lives in memory only.
  # On hub pod restart users re-login; running notebook servers are unaffected.
  db:
    type: sqlite-memory
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi
  # Configure Dask integration
  extraConfig:
    dask-config: |
      c.JupyterHub.allow_named_servers = True
      c.Spawner.default_url = '/lab'
  # Authentication - simple dummy auth for testing
  # In production, configure LDAP, OAuth, etc.
  config:
    Authenticator:
      admin_users:
        - admin
    DummyAuthenticator:
      password: "changeme"
    JupyterHub:
      authenticator_class: dummy

# Proxy configuration
proxy:
  # Note: Image will be rewritten by Zarf
  chp:
    image:
      name: quay.io/jupyterhub/configurable-http-proxy
      tag: "4.5.5"
      pullPolicy: IfNotPresent
  service:
    type: NodePort
    nodePorts:
      http: 30080

# Single-user server configuration
singleuser:
  # Air-gap notebook image: holoviews + h5py + generate_hdf5 (requirements-airgap.txt).
  # MUST match zarf.yaml cybersec-images / dask-cluster (content-derived tag from `just image`).
  # Zarf rewrites registry and may append -zarf-<hash>.
  image:
    name: localhost:5555/cybersec-dask
    tag: "2025.2.0-74bc219d3a"
    pullPolicy: IfNotPresent
  # Network tools init container - same bundled image (air-gap, no extra pulls)
  networkTools:
    image:
      name: localhost:5555/cybersec-dask
      tag: "2025.2.0-74bc219d3a"
      pullPolicy: IfNotPresent
  # Disable block-cloud-metadata init container (requires iptables,
  # which is not present in the cybersec-dask image)
  cloudMetadata:
    blockWithIptables: false
  # Init container: copy jupyterhub package from hub image into shared volume.
  # The cybersec-dask image has jupyterlab + jupyter_server but NOT the
  # jupyterhub package needed for jupyterhub-singleuser. The hub image (k8s-hub)
  # has it pre-installed. This avoids rebuilding the cybersec-dask image.
  initContainers:
    - name: inject-jupyterhub-pkg
      image: quay.io/jupyterhub/k8s-hub:4.0.0
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          SP=/usr/local/lib/python3.12/site-packages
          DST=/srv/jupyterhub-pkg
          # Copy jupyterhub and its pure-Python dependencies that are
          # missing from the cybersec-dask image. Skip .so files since
          # they are cpython-312 but the target image runs cpython-310;
          # all these packages have pure-Python fallbacks.
          for pkg in jupyterhub oauthlib certipy pamela pydantic pydantic_core \
                     sqlalchemy alembic mako greenlet typing_extensions \
                     annotated_types; do
            if [ -d "$SP/$pkg" ]; then
              cp -a "$SP/$pkg" "$DST/$pkg"
            fi
          done
          # Also copy single-file modules and .dist-info metadata
          for f in $SP/sqlalchemy_cockroachdb* $SP/typing_extensions* \
                   $SP/annotated_types*; do
            [ -e "$f" ] && cp -a "$f" "$DST/" 2>/dev/null || true
          done
          # Remove compiled .so extensions (won't work cross-version)
          find "$DST" -name "*.cpython-312*.so" -delete 2>/dev/null || true
          echo "jupyterhub + deps copied (pure-Python, no .so files)"
      volumeMounts:
        - name: jupyterhub-pkg
          mountPath: /srv/jupyterhub-pkg
  # Use 'python -m jupyterhub.singleuser' instead of the 'jupyterhub-singleuser'
  # entry-point script, since the binary is not on PATH in the cybersec-dask image.
  # Writable home is /root. ConfigMap samples are RO at /root/sample-notebooks/
  # only — never mount over /app (breaks Lab). At start we *copy* samples into
  # /root/*.ipynb so the File browser shows editable notebooks at home root
  # (incl. HDF5_*.ipynb + generate_hdf5.py + cluster_env.py for in-situ HDF5).
  # "Duplicate" must not target the RO sample-notebooks/ folder.
  # Converge T5.sample-notebooks requires those CM keys; after redeploy users
  # must Stop/Start singleuser so this seed runs again.
  cmd:
    - bash
    - -lc
    - |
      set -e
      HOME_DIR=/root
      SAMPLES="${HOME_DIR}/sample-notebooks"
      # Strip stale image-baked notebooks under WORKDIR /app (not used for Lab root)
      if [ -d /app/sample-notebooks ]; then
        rm -f /app/sample-notebooks/*.ipynb 2>/dev/null || true
        rm -rf /app/sample-notebooks/.ipynb_checkpoints 2>/dev/null || true
        printf '%s\n' \
          'Jupyter home is /root (writable).' \
          'Samples are copied there at server start; RO originals: /root/sample-notebooks/' \
          > /app/sample-notebooks/README.md 2>/dev/null || true
      fi
      # Seed writable working copies in HOME (ConfigMap mount is read-only)
      if [ -d "$SAMPLES" ]; then
        for f in "$SAMPLES"/*.ipynb "$SAMPLES"/generate_hdf5.py "$SAMPLES"/cluster_env.py; do
          [ -f "$f" ] || continue
          base=$(basename "$f")
          # Always refresh from ConfigMap so users get latest samples after redeploy
          cp -f "$f" "${HOME_DIR}/${base}"
        done
        # Import path for `from cluster_env import …` without PYTHONPATH hacks
        if [ -f "${HOME_DIR}/cluster_env.py" ]; then
          export PYTHONPATH="${HOME_DIR}:${PYTHONPATH:-}"
        fi
        printf '%s\n' \
          'sample-notebooks/ is READ-ONLY (ConfigMap).' \
          'Editable copies are in this folder (/root/*.ipynb) — open those.' \
          'Do not Duplicate inside sample-notebooks/ (Errno 30).' \
          > "${HOME_DIR}/README.txt"
      fi
      exec python -m jupyterhub.singleuser --allow-root \
        --ServerApp.root_dir=/root \
        --ServerApp.preferred_dir=/root
  # Run as root (UID 0) because the Dask base image has no 'jovyan' user.
  # Z2JH defaults runAsUser=1000 but the cybersec-dask image only has root.
  uid: 0
  fsGid: 0
  # Resource allocation per user
  cpu:
    limit: 2
    guarantee: 0.5
  memory:
    limit: 4G
    guarantee: 1G
  # Storage for notebooks
  # Using emptyDir (no StorageClass provisioner in bare RKE2 air-gap).
  # Notebooks persist until pod restart. Users should save work to S3.
  # To enable persistent storage, deploy a local-path-provisioner and
  # change type to 'dynamic'.
  storage:
    type: none
    # RO samples under $HOME/sample-notebooks; startup copies to $HOME/*.ipynb
    extraVolumes:
      - name: sample-notebooks
        configMap:
          name: sample-notebooks
      - name: jupyterhub-pkg
        emptyDir:
          sizeLimit: 256Mi
    extraVolumeMounts:
      - name: sample-notebooks
        mountPath: /root/sample-notebooks
        readOnly: true
      - name: jupyterhub-pkg
        mountPath: /srv/jupyterhub-pkg
        readOnly: true
  # Network policy - allow singleuser pods full egress to reach:
  #   - Dask scheduler (10.43.x.x ClusterIP or dask.svc.cluster.local)
  #   - RustFS/S3 on host network (192.168.x.x)
  #   - Any other cluster services
  # Default JupyterHub NetworkPolicy blocks private IPs in egress,
  # which prevents notebook access to Dask and S3.
  networkPolicy:
    egressAllowRules:
      privateIPs: true
  # Environment variables for S3 access (RustFS lab: admin/admin, bucket cyberphy)
  extraEnv:
    # jupyterhub pkg (init inject) + /app for generate_hdf5.py (image-baked, not under ConfigMap)
    PYTHONPATH: "/srv/jupyterhub-pkg:/app"
    # Ensure HOME is writable (Dask base image runs as root)
    HOME: "/root"
    # Prefer HOME as Jupyter contents root even if image WORKDIR is /app
    JUPYTER_SERVER_ROOT: "/root"
    S3_ENDPOINT: "###ZARF_VAR_S3_ENDPOINT###"
    AWS_ACCESS_KEY_ID: "###ZARF_VAR_S3_ACCESS_KEY###"
    AWS_SECRET_ACCESS_KEY: "###ZARF_VAR_S3_SECRET_KEY###"
    # Optional STS (empty when using long-lived keys)
    AWS_SESSION_TOKEN: "###ZARF_VAR_S3_SESSION_TOKEN###"
    S3_BUCKET: "###ZARF_VAR_S3_BUCKET###"
    # Region + dataset path — same vars converge patches into panel-viz ConfigMap
    AWS_REGION: "###ZARF_VAR_S3_REGION###"
    AWS_DEFAULT_REGION: "###ZARF_VAR_S3_REGION###"
    S3_REGION: "###ZARF_VAR_S3_REGION###"
    # s3://$S3_BUCKET/ when unset at package time; operators may set OTEL_DATA_PATH
    OTEL_DATA_PATH: "s3://###ZARF_VAR_S3_BUCKET###/otel-notebook/"
    OTEL_PREFIX: "otel-notebook"
    # Distributed Client address only. Do NOT set DASK_SCHEDULER=tcp://… here:
    # dask maps DASK_SCHEDULER env → config.scheduler *type* (threads|distributed|…),
    # and dd.read_parquet planning then raises ValueError on the tcp:// string.
    DASK_SCHEDULER_ADDRESS: "tcp://cybersec-dask-scheduler.dask.svc.cluster.local:8786"
    USE_DASK: "1"
    # HDF5_CPHY notebook profile (lab | lab_tiny | airgap) — generate_hdf5.PROFILES
    HDF5_PROFILE: "lab"
    # Air-gap: do not load Bokeh/HoloViews JS from cdn.bokeh.org (blank plots otherwise)
    BOKEH_RESOURCES: "inline"

# Scheduling - allow users on any node
scheduling:
  userScheduler:
    enabled: false
  userPlaceholder:
    enabled: false

# Culling - shut down idle servers
cull:
  enabled: true
  timeout: 3600  # 1 hour
  every: 600     # Check every 10 minutes

# Disable user pulling of images (air-gap)
prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false
