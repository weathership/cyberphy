kind: ZarfPackageConfig
metadata:
  name: cybersec-dask
  description: Air-gap deployment package for Dask, JupyterHub, and Panel-Viz on RKE2
  version: "1.6.7"
  architecture: amd64
  authors: Cyberphy Toolkit Team
  url: https://github.com/cloudera/cybersec
  documentation: https://cloudera.github.io/cybersec/airgap-deployment.html

variables:
  # Registry configuration
  - name: REGISTRY_URL
    description: External registry URL (empty = use Zarf internal registry)
    default: ""

  # Ingress configuration
  - name: INGRESS_CLASS
    description: Kubernetes ingress controller class (RKE2 ships nginx; Traefik is K3s)
    default: nginx
  - name: INGRESS_DOMAIN
    description: Base domain for ingress hostnames
    default: cyberphy.local

  # Dask configuration (multi-core / multi-node: raise REPLICAS for HDF5 2 TiB)
  - name: DASK_WORKER_REPLICAS
    description: >-
      Number of Dask worker pods. Use 4–8 on a multi-core lab node; 16–32 (or
      ~2–4× node count) for air-gap 2 TiB HDF5. Set 1 only for tiny/smoke hosts.
    default: "4"
  - name: DASK_WORKER_NTHREADS
    description: Threads per worker (--nthreads). Keep ≤ DASK_WORKER_CPU.
    default: "2"
  - name: DASK_WORKER_CPU
    description: Per-worker CPU limit (must be ≥ NTHREADS or workers stay serial).
    default: "2"
  - name: DASK_WORKER_MEMORY
    description: Per-worker memory limit and dask-worker --memory-limit (e.g. 6Gi).
    default: "6Gi"
  - name: DASK_SPILL_DIR
    description: Host path for Dask worker spill-to-disk (set to NFS mount if available)
    default: /tmp/dask-spill

  # S3 storage configuration (for Iceberg/data access)
  - name: S3_ENDPOINT
    description: S3-compatible endpoint URL
    default: ""
  - name: S3_BUCKET
    description: >-
      S3 bucket name for OTEL data (notebooks + Panel-Viz). PROVIDED AT DEPLOY TIME —
      in air-gap the operator supplies the given bucket via --set S3_BUCKET=...; never
      hardcoded. No default, so a missing value fails loud instead of silently using a
      wrong bucket.
    default: ""
  - name: S3_REGION
    description: AWS region for S3 access
    default: "us-east-1"
  - name: S3_ACCESS_KEY
    description: S3 access key
    default: ""
    sensitive: true
  - name: S3_SECRET_KEY
    description: S3 secret key
    default: ""
    sensitive: true
  - name: S3_SESSION_TOKEN
    description: AWS STS session token (for IAM role credentials)
    default: ""
    sensitive: true

  # Optional AI agent (ACP) — OFF by default; the deterministic terminal works
  # with no model. Set AGENT_BACKEND=acp + AGENT_MODEL_BASE_URL to enable.
  - name: AGENT_BACKEND
    description: Agent backend — "null" (off) or "acp"
    default: "null"
  - name: AGENT_ACP_COMMAND
    description: Command that launches the ACP agent subprocess
    default: "vibe-acp"
  - name: AGENT_MODEL_BASE_URL
    description: OpenAI-compatible model endpoint (llama.cpp / vLLM)
    default: ""
  - name: AGENT_MODEL
    description: Model name the agent requests
    default: "mistral"

  # Terminal WebSocket override for the embedded REPL (incl. the `switch` command).
  # Empty = browser auto-detect (:5006 → ws://host:8765; otherwise same-origin /ws,
  # which the bundled ingress routes to the pty-proxy). Set explicitly only for
  # NodePort/tunnel access patterns where neither applies, e.g. ws://<node>:30765.
  - name: PTY_PROXY_WS
    description: Explicit terminal WebSocket URL (empty = auto-detect / ingress /ws)
    default: ""

components:
  # ===========================================================================
  # Storage Provisioner - OPT-IN (dynamic provisioning only)
  # ===========================================================================
  # OFF by default: the resilient air-gap path (the only modality releases target)
  # needs NO default StorageClass — the Zarf registry binds a claimRef hostPath PV
  # (convergence invariant T0.5.registry-pv), so single disk-limited nodes "just
  # work". Enable on a resourced multi-node cluster running workloads that need
  # dynamic PVCs via `converge --enable-dynamic-provisioning`, which kubectl-applies
  # this manifest (node-preloaded image). Images stay declared so the package remains
  # CLOSED for that opt-in path regardless of the default.
  - name: local-path-provisioner
    required: false
    default: false
    description: Rancher local-path-provisioner (default StorageClass — opt-in, dynamic provisioning only)
    images:
      - rancher/local-path-provisioner:v0.0.30
      - busybox:1.37
    manifests:
      - name: local-path-provisioner
        files:
          - manifests/local-path-provisioner.yaml
    actions:
      onDeploy:
        after:
          - wait:
              cluster:
                kind: Pod
                name: app=local-path-provisioner
                namespace: local-path-storage
                condition: Ready
            maxTotalSeconds: 60
            description: Wait for local-path-provisioner to be ready

  # ===========================================================================
  # Core images - always included
  # ===========================================================================
  - name: cybersec-images
    required: true
    description: Container images for Cyberphy Dask deployment
    images:
      # Single air-gap app image: Dask + Jupyter + Panel + h5py/holoviews (requirements-airgap.txt).
      # Build: podman build -t localhost:5555/cybersec-dask:2025.2.0-74bc219d3a \
      #          -f zarf/images/Dockerfile.cybersec-dask .
      # FAIL the package create if this tag is missing or lacks h5py — no runtime pip.
      - localhost:5555/cybersec-dask:2025.2.0-74bc219d3a
      # Dask Kubernetes Operator
      - ghcr.io/dask/dask-kubernetes-operator:2024.1.0

  # ===========================================================================
  # Dask Operator - Helm chart deployment
  # ===========================================================================
  - name: dask-operator
    required: true
    description: Dask Kubernetes Operator (manages DaskCluster CRDs)
    charts:
      - name: dask-kubernetes-operator
        namespace: dask-operator
        localPath: charts/dask-kubernetes-operator-2024.1.0.tgz
        version: 2024.1.0
        valuesFiles:
          - manifests/dask-operator-values.yaml

  # ===========================================================================
  # Dask Cluster - DaskCluster CRD manifest
  # ===========================================================================
  - name: dask-cluster
    required: true
    description: DaskCluster deployment for distributed computing
    manifests:
      # Split into separate Helm releases to ensure namespace exists before
      # DaskCluster CRD instance is created. Combining them into a single
      # release can cause the DaskCluster to silently fail to be created.
      - name: dask-namespaces
        files:
          - manifests/namespace.yaml
      - name: dask-cluster-cr
        files:
          - manifests/dask-cluster.yaml
    actions:
      onDeploy:
        after:
          - wait:
              cluster:
                kind: Pod
                name: dask.org/component=scheduler
                namespace: dask
                condition: Ready
            maxTotalSeconds: 900
            description: Wait for Dask scheduler to be ready
          - cmd: |
              # Fail loud if the packaged image is missing notebook deps (air-gap: no pip).
              SCHEDULER=$(./zarf tools kubectl get pod -n dask -l dask.org/component=scheduler -o jsonpath='{.items[0].metadata.name}')
              if [ -z "$SCHEDULER" ]; then
                echo "Warning: no Dask scheduler pod — skip h5py smoke"
                exit 0
              fi
              ./zarf tools kubectl exec -n dask "$SCHEDULER" -- python -c "
              import sys
              missing = []
              for m in ('h5py', 'holoviews', 'datashader', 's3fs', 'distributed', 'numpy'):
                  try:
                      __import__(m)
                  except Exception as e:
                      missing.append('%s (%s)' % (m, e))
              if missing:
                  print('AIRGAP IMAGE MISSING DEPS:', ', '.join(missing))
                  print('Rebuild cybersec-dask:2025.2.0-74bc219d3a from Dockerfile.cybersec-dask')
                  sys.exit(1)
              import h5py, holoviews
              print('airgap image OK: h5py', h5py.__version__, 'holoviews', holoviews.__version__)
              "
            description: Verify packaged image has h5py/holoviews (no runtime pip)
          - cmd: |
              BUCKET="${ZARF_VAR_S3_BUCKET}"
              ENDPOINT="${ZARF_VAR_S3_ENDPOINT}"
              if [ -z "$BUCKET" ] || [ -z "$ENDPOINT" ]; then
                echo "S3 not fully configured (BUCKET=$BUCKET ENDPOINT=$ENDPOINT), skipping bucket ensure"
                exit 0
              fi
              # `./zarf tools kubectl` — the executing zarf binary substitutes itself, so
              # the action needs NO kubectl on the node's PATH (air-gap RKE2 keeps kubectl
              # in /var/lib/rancher/rke2/bin, off root's PATH — field 2026-07-15)
              SCHEDULER=$(./zarf tools kubectl get pod -n dask -l dask.org/component=scheduler -o jsonpath='{.items[0].metadata.name}')
              if [ -z "$SCHEDULER" ]; then
                echo "Warning: no Dask scheduler pod found, skipping bucket ensure"
                exit 0
              fi
              # ENSURE the data bucket exists (idempotent). On a real air-gap deploy the
              # bucket is usually PROVIDED, so the exists-check short-circuits; against a
              # fresh dev/rehearsal MinIO it is created. Endpoint + creds come from the
              # scheduler pod's env (templated from ZARF_VAR_S3_*), so no secret rides this
              # argv. fs.exists() avoids depending on a specific s3fs exception type, and
              # any failure is PRINTED (not silently swallowed) so it shows in the log.
              ./zarf tools kubectl exec -n dask "$SCHEDULER" -- python -c "
              import s3fs, os, sys
              fs = s3fs.S3FileSystem(
                  key=os.environ.get('AWS_ACCESS_KEY_ID') or None,
                  secret=os.environ.get('AWS_SECRET_ACCESS_KEY') or None,
                  token=os.environ.get('AWS_SESSION_TOKEN') or None,
                  client_kwargs={'endpoint_url': os.environ.get('S3_ENDPOINT') or None},
                  config_kwargs={'s3': {'addressing_style': 'path'}, 'signature_version': 's3v4'},
              )
              bucket = '$BUCKET'
              fs.invalidate_cache()
              try:
                  if fs.exists(bucket):
                      print('S3 bucket already exists:', bucket)
                  else:
                      fs.mkdir(bucket)
                      print('Created S3 bucket:', bucket)
              except Exception as e:
                  print('ERROR ensuring bucket %r: %s: %s' % (bucket, type(e).__name__, e))
                  sys.exit(1)
              "
              RC=$?
              [ "$RC" -eq 0 ] || echo "Warning: bucket ensure failed (rc=$RC) — create '$BUCKET' on the S3 endpoint manually"
            description: Ensure the S3 data bucket exists (if S3 is configured)

  # ===========================================================================
  # JupyterHub - optional, on by default
  # ===========================================================================
  - name: jupyterhub
    required: false
    default: true
    description: JupyterHub for interactive notebooks with Dask integration
    images:
      - quay.io/jupyterhub/k8s-hub:4.0.0
      - quay.io/jupyterhub/configurable-http-proxy:4.5.5
      # User notebook environment uses the custom cybersec-dask image
      - localhost:5555/cybersec-dask:2025.2.0-74bc219d3a
    charts:
      - name: jupyterhub
        namespace: jupyterhub
        localPath: charts/jupyterhub-4.0.0.tgz
        version: 4.0.0
        valuesFiles:
          - manifests/jupyterhub-values.yaml
    actions:
      onDeploy:
        after:
          - wait:
              cluster:
                kind: Pod
                name: component=hub
                namespace: jupyterhub
                condition: Ready
            maxTotalSeconds: 600
            description: Wait for JupyterHub hub to be ready (bounded for air-gap)

  # ===========================================================================
  # Panel-Viz - optional, on by default
  # ===========================================================================
  - name: panel-viz
    required: false
    default: true
    description: Panel visualization dashboard for OTEL traces, Data-View, and VPC flow stream
    manifests:
      - name: panel-viz-deployment
        files:
          - manifests/panel-viz.yaml
          - manifests/vpc-flow-generator.yaml
    actions:
      onDeploy:
        after:
          - wait:
              cluster:
                kind: Pod
                name: app=otel-navigator
                namespace: panel-viz
                condition: Ready
            maxTotalSeconds: 300
            description: Wait for Panel-Viz (otel-navigator) to be ready
          # vpc-flow-generator is best-effort data-gen — do NOT wait on it. A
          # failed/Pending generator used to fail the whole panel-viz component
          # deploy (and thus converge T5 rem) even when otel-navigator was fine.

  # ===========================================================================
  # Navigator Engine - gRPC engine for terminal-driven heatmap updates (M2)
  # ===========================================================================
  - name: navigator-engine
    required: false
    default: true
    description: NavigatorEngine gRPC server (drives OTEL Navigator via terminal commands)
    manifests:
      - name: navigator-engine-deployment
        files:
          - manifests/engine.yaml
    actions:
      onDeploy:
        after:
          - wait:
              cluster:
                kind: Pod
                name: app=navigator-engine
                namespace: panel-viz
                condition: Ready
            maxTotalSeconds: 180
            description: Wait for NavigatorEngine to be ready

  # ===========================================================================
  # Sample Notebooks - embedded in ConfigMap (generated by scripts/embed-notebooks.py)
  # ===========================================================================
  - name: sample-notebooks
    required: false
    default: true
    description: >-
      Sample notebooks ConfigMap for JupyterHub in situ (OTEL + Dask + HDF5).
      Seeds /root/*.ipynb, generate_hdf5.py, cluster_env.py at singleuser start.
      Rebuild with: python3 zarf/scripts/verify-sample-notebooks.py before package create.
      Converge T5.sample-notebooks requires HDF5 keys + sidecars.
    manifests:
      - name: sample-notebooks-manifests
        namespace: jupyterhub
        files:
          - manifests/jupyterhub-namespace.yaml
          - manifests/sample-notebooks-configmap.yaml

  # ===========================================================================
  # Ingress - optional, enables external access via Traefik
  # ===========================================================================
  - name: ingress
    required: false
    default: true
    description: Ingress resources for external access (requires Traefik or nginx)
    manifests:
      - name: ingress-resources
        files:
          - manifests/ingress.yaml
