[project]
name = "cybersec"
version = "0.1.0"
description = "Cybersec toolkit with Flink processing and Iceberg storage"
readme = "README.md"
requires-python = ">=3.12,<3.13"  # Pin to 3.12 to avoid Beam envoy-data-plane issues on 3.13+
dependencies = [
    # NumPy constrained for numba/datashader compatibility
    "numpy>=2.0.0,<2.4",
    "pyarrow>=15.0.0",
    "pandas>=2.2.0",
    "psycopg2-binary>=2.9.9",
    "boto3>=1.34.0",
    "pyiceberg[s3fs,sql-postgres,pyiceberg-core]>=0.10.0",
    "flask>=3.0.0",
    # Bootstrap CLI dependencies
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Bootstrap MCP server dependencies
    "fastmcp>=0.1.0",
    # HTTP client for health checks
    "httpx>=0.27.0",
    # Process monitoring for health checks
    "psutil>=5.9.0",
    # TOML writing
    "tomli-w>=1.0.0",
    # Prometheus metrics export for cost monitoring
    "prometheus-client>=0.19.0",
    "ty>=0.0.13",
    "ortools>=9.12.4544",
    "pyhocon>=0.3.61",
    "ansible>=13.3.0",
    "ansible-navigator>=26.1.2",
    "python-snappy>=0.7.3",
    # PyFlink - patched 1.20.1 (cloudpickle 3.x / Dask + avro 1.12). See
    # tool.uv.sources: vendored at thirdparty/flink-python so `uv sync` does
    # not require the 5+ GB thirdparty/flink Java submodule.
    "apache-flink>=1.20.0",
    "h5py>=3.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "ruff>=0.2.0",
    "grpcio-tools>=1.60.0,<2.0.0",
]

# gRPC engine — install with: uv sync --extra engine
engine = [
    "grpcio>=1.60.0,<2.0.0",
    "websockets>=12.0,<14.0",
]

# K8s/Dask stack - install with: uv sync --extra k8s
# Only needed when connecting to Dask clusters running in Kubernetes.
# Dask itself runs in K8s (deployed via Helm), not locally.
# Compatible with PyFlink (patched thirdparty/flink uses cloudpickle 3.x).
k8s = [
    "dask-kubernetes>=2025.7.0",
    "dask[complete]>=2025.2.0",
    "distributed>=2025.2.0",
]

observability = [
    # HoloViews visualization stack
    "holoviews>=1.18.0",
    "datashader>=0.16.0",
    "bokeh>=3.3.0",
    "panel>=1.3.0",
    "colorcet>=3.0.0",
    "param>=2.0.0",
    # Graph analysis
    "networkx>=3.0",
    # OTel protobuf definitions (optional, for OTLP parsing)
    "opentelemetry-proto>=1.20.0",
    "protobuf>=4.0.0",
    # S3 filesystem support
    "s3fs>=2024.2.0",
]

# SC26 Benchmark extra - install with: uv sync --extra benchmark
# For running Dask/Datashader scaling benchmarks.
# Compatible with PyFlink (patched thirdparty/flink uses cloudpickle 3.x).
benchmark = [
    # Dask distributed computing
    "dask[complete]>=2025.2.0",
    "distributed>=2025.2.0",
    # S3 filesystem support
    "s3fs>=2024.2.0",
    # Publication figures
    "matplotlib>=3.8.0",
    # NumPy constrained for numba compatibility
    "numpy>=2.0.0,<2.4",
    # Numba for datashader (must be 0.60+ for Python 3.12)
    "numba>=0.60.0",
    # Datashader for out-of-core visualization (0.16.3+ for Python 3.12)
    "datashader>=0.16.3",
    # Colorcet for datashader colormaps
    "colorcet>=3.0.0",
]

[project.scripts]
cybersec = "cybersec.cli.main:run"
cybersec-mcp = "cybersec.mcp.server:run_server"

[project.entry-points."jupyter_serverproxy_servers"]
otel-explorer = "cybersec.observability.viz.server:setup_panel_proxy"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cybersec*"]

[tool.uv]
package = true

# Override apache-flink with the patched 1.20.1 tree (cloudpickle 3.x / Dask,
# avro 1.12, Python 3.12 bounds). This is the PyPI sdist plus the same delta
# as rch/asf-flink@rch/devenv-cybersec — kept as a regular tree so a clone can
# `uv sync` without initializing thirdparty/flink.
# See thirdparty/flink-python/PATCHES.md.
[tool.uv.sources]
apache-flink = { path = "thirdparty/flink-python", editable = true }
