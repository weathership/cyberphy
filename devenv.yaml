# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  # Pin devenv modules to avoid allowAliases bug in newer versions
  # See: https://github.com/cachix/devenv/issues - devenv CLI doesn't pass
  # allowAliases to nixpkgs config, causing darwin evaluation failures.
  # Remove this pin once devenv releases a fix.
  devenv:
    url: github:cachix/devenv/92ad9c70fad164e8f4a3656dec91717a5c42cd98?dir=src/modules
  # Optional: source tree for reference / future from-source builds.
  # Runtime package is nix/rustfs.nix (release binary with console UI) — the
  # upstream flake default package does not embed console static assets.
  rustfs:
    url: github:rustfs/rustfs

# If you're using non-OSS software, you can set allowUnfree to true.
allowUnfree: true

# If you're willing to use a package that's vulnerable
# permittedInsecurePackages:
#  - "openssl-1.1.1w"

# Local modules (rustfs service is not in the pinned devenv modules pin above)
imports:
  - ./modules/rustfs.nix
